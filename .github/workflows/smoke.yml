# ============================================
# KATA Architecture - Smoke Test Pipeline
# ============================================
# Purpose: Daily health check running only @critical tagged tests.
# Perfect for verifying app components work after deployments and releases.

name: Smoke Tests
run-name: ${{ github.actor }} triggered Smoke Tests on ${{ github.event.inputs.environment || 'staging' }}

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 2:00 AM UTC

  workflow_dispatch:
    inputs:
      environment:
        description: Select the Test Environment
        required: true
        default: 'staging'
        type: choice
        options:
          - local
          - staging
          - production
      generate_allure:
        description: Generate Allure Report
        required: true
        default: true
        type: boolean

concurrency:
  # Same gh-pages publish race as regression.yml — queue, never cancel.
  group: smoke-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  TEST_ENV: ${{ github.event.inputs.environment || 'staging' }}
  LOCAL_USER_EMAIL: ${{ secrets.LOCAL_USER_EMAIL }}
  LOCAL_USER_PASSWORD: ${{ secrets.LOCAL_USER_PASSWORD }}
  STAGING_USER_EMAIL: ${{ secrets.STAGING_USER_EMAIL }}
  STAGING_USER_PASSWORD: ${{ secrets.STAGING_USER_PASSWORD }}
  STAGING_USER_PAT: ${{ secrets.STAGING_USER_PAT }}
  STAGING_USER_READONLY_PAT: ${{ secrets.STAGING_USER_READONLY_PAT }}
  # Production credentials — required only when TEST_ENV=production is selected.
  # Missing secrets fail loudly via `bun run test:env:check` (validateTestEnv.ts).
  PRODUCTION_USER_EMAIL: ${{ secrets.PRODUCTION_USER_EMAIL }}
  PRODUCTION_USER_PASSWORD: ${{ secrets.PRODUCTION_USER_PASSWORD }}
  PRODUCTION_USER_PAT: ${{ secrets.PRODUCTION_USER_PAT }}
  TMS_PROVIDER: ${{ secrets.TMS_PROVIDER || 'jira' }}
  ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
  ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
  AUTO_SYNC: ${{ secrets.AUTO_SYNC || 'true' }}

jobs:
  SmokeTest:
    name: Smoke Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: bun install

      - name: Validate Test Environment Variables
        run: bun run test:env:check

      - name: Install Playwright Browsers
        run: bun run pw:install

      - name: Run Smoke Tests (@critical) on ${{ env.TEST_ENV }}
        run: bun run test:smoke

      # Runs after the Playwright process exits: reports/atc_results.json is
      # written by KataReporter.onEnd() (issue #27), so nothing inside the run
      # can read it. `always()` so a failing suite still reports its results.
      - name: Sync Results to TMS
        if: always() && env.AUTO_SYNC == 'true'
        run: bun run test:sync

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-allure-results
          path: allure-results/
          retention-days: 10

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-results
          path: test-results/
          retention-days: 10

      - name: Upload Failure Evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-failure-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 10

      - name: Cleanup Workspace
        if: always()
        run: |
          rm -rf node_modules
          rm -rf allure-results
          rm -rf test-results
          rm -rf playwright-report

  # ============================================
  # Build & Deploy Allure Report
  # ============================================
  # NOTE: GitHub Pages is a temporary solution for hosting Allure reports.
  # For production, consider implementing a dedicated Test Portal with:
  # - Authentication and protected access
  # - API to upload Allure results to a database
  # - Centralized report management across projects
  # See: KATA Test Portal (future enhancement)
  # ============================================
  allure-report:
    name: Build & Deploy Allure Report
    needs: SmokeTest
    runs-on: ubuntu-latest
    if: ${{ always() && github.event.inputs.generate_allure != 'false' }}

    steps:
      - name: Get Allure History
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1
        continue-on-error: true

      - name: Download Smoke Test Artifacts
        uses: actions/download-artifact@v8
        with:
          name: smoke-allure-results
          path: smoke-artifacts/allure-results
        continue-on-error: true

      - name: Check Allure Results
        id: check_allure
        shell: bash
        run: |
          if [ -d "smoke-artifacts/allure-results" ] && [ -n "$(ls -A smoke-artifacts/allure-results 2>/dev/null)" ]; then
            echo "Allure results found."
            echo "has_results=true" >> $GITHUB_OUTPUT
          else
            echo "No Allure results found. Skipping report generation."
            echo "has_results=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Allure Report
        if: steps.check_allure.outputs.has_results == 'true'
        uses: simple-elf/allure-report-action@v1.15
        with:
          gh_pages: gh-pages
          subfolder: ${{ env.TEST_ENV }}/smoke
          allure_results: smoke-artifacts/allure-results
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 3

      - name: Deploy to GitHub Pages
        if: steps.check_allure.outputs.has_results == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history/${{ env.TEST_ENV }}/smoke
          destination_dir: ${{ env.TEST_ENV }}/smoke
          keep_files: true

      - name: Post Report URL
        if: steps.check_allure.outputs.has_results == 'true'
        run: |
          echo "## Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "View the report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ env.TEST_ENV }}/smoke/" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Notify Failure — a red suite is never silent.
  # Opens one labeled issue per failing workflow,
  # deduplicated on the open-issue title.
  # ============================================
  notify-failure:
    name: Notify Failure
    needs: [SmokeTest, allure-report]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Open labeled failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflow = context.workflow;
            const runId = context.runId;
            const runNumber = context.runNumber;
            const label = 'ci-failure';
            const title = `[CI] ${workflow} failed - run #${runNumber}`;

            const { data: open } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: label,
            });
            if (open.some(i => i.title === title)) {
              core.notice(`Duplicate open failure issue for "${workflow}" - skipping.`);
              return;
            }

            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;
            const body = [
              `Workflow **${workflow}** failed.`,
              '',
              `- Run: ${runUrl}`,
              `- Ref: \`${context.ref}\``,
              `- Commit: \`${context.sha}\``,
            ].join('\n');

            await github.rest.issues.create({
              owner,
              repo,
              title,
              labels: [label],
              body,
            });
            core.notice(`Opened failure issue "${title}".`);
