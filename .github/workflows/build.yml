# ============================================
# KATA Architecture - TestBuild Pipeline
# ============================================
# Purpose: Validate framework compiles and passes static checks. Runs on every PR
# to main AND nightly (self-check) so a broken framework is caught even without a
# PR in flight.

name: TestBuild Checks
run-name: ${{ github.actor }} triggered TestBuild Checks on ${{ github.ref_name }}

on:
  schedule:
    - cron: '0 6 * * *' # Nightly framework self-check (6:00 AM UTC)

  pull_request:
    branches:
      - main

env:
  CI: true
  TEST_ENV: 'staging'
  # Credentials (required to validate environment configuration)
  STAGING_USER_EMAIL: ${{ secrets.STAGING_USER_EMAIL }}
  STAGING_USER_PASSWORD: ${{ secrets.STAGING_USER_PASSWORD }}
  STAGING_USER_PAT: ${{ secrets.STAGING_USER_PAT }}
  STAGING_USER_READONLY_PAT: ${{ secrets.STAGING_USER_READONLY_PAT }}
  # TMS Sync — static-check pipeline runs no tests and no TMS sync
  AUTO_SYNC: 'false'
  TMS_PROVIDER: 'jira'

jobs:
  TestBuild:
    name: Framework Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: bun install

      - name: Validate Test Environment Variables
        run: bun run test:env:check

      - name: TypeScript Check
        run: bun run types:check

      - name: ESLint Check
        run: bun run lint:check

      - name: Playwright Compile Check
        run: bunx playwright test --list
        # This validates that all test files compile correctly without executing them

      - name: Validate Playwright Config
        run: |
          echo "Validating Playwright configuration..."
          bunx playwright test --config=playwright.config.ts --list > /dev/null 2>&1 && echo "Configuration valid" || echo "Configuration warning detected"

      - name: Install Playwright (API context)
        run: bun run pw:install

  # ============================================
  # Notify Failure — a red suite is never silent.
  # Opens one labeled issue per failing workflow,
  # deduplicated on the open-issue title.
  # ============================================
  notify-failure:
    name: Notify Failure
    needs: [TestBuild]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Open labeled failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflow = context.workflow;
            const runId = context.runId;
            const runNumber = context.runNumber;
            const label = 'ci-failure';
            const title = `[CI] ${workflow} failed - run #${runNumber}`;

            const { data: open } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: label,
            });
            if (open.some(i => i.title === title)) {
              core.notice(`Duplicate open failure issue for "${workflow}" - skipping.`);
              return;
            }

            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;
            const body = [
              `Workflow **${workflow}** failed.`,
              '',
              `- Run: ${runUrl}`,
              `- Ref: \`${context.ref}\``,
              `- Commit: \`${context.sha}\``,
            ].join('\n');

            await github.rest.issues.create({
              owner,
              repo,
              title,
              labels: [label],
              body,
            });
            core.notice(`Opened failure issue "${title}".`);
