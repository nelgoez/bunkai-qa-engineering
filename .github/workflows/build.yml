# ============================================
# KATA Architecture - TestBuild Pipeline
# ============================================
# Purpose: Validate framework compiles and passes static checks. Runs on every PR
# to main AND nightly (self-check) so a broken framework is caught even without a
# PR in flight.

name: TestBuild Checks
run-name: ${{ github.actor }} triggered TestBuild Checks on ${{ github.ref_name }}

on:
  schedule:
    - cron: '0 6 * * *' # Nightly framework self-check (6:00 AM UTC)

  pull_request:
    branches:
      - main

env:
  CI: true
  TEST_ENV: 'staging'
  # Credentials (required to validate environment configuration)
  STAGING_USER_EMAIL: ${{ secrets.STAGING_USER_EMAIL }}
  STAGING_USER_PASSWORD: ${{ secrets.STAGING_USER_PASSWORD }}
  STAGING_USER_PAT: ${{ secrets.STAGING_USER_PAT }}
  STAGING_USER_READONLY_PAT: ${{ secrets.STAGING_USER_READONLY_PAT }}
  # TMS Sync — push test results to Jira/Xray on CI runs
  AUTO_SYNC: 'true'
  TMS_PROVIDER: 'jira'

jobs:
  TestBuild:
    name: Framework Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: bun install

      - name: Validate Test Environment Variables
        run: bun run test:env:check

      - name: TypeScript Check
        run: bun run types:check

      - name: ESLint Check
        run: bun run lint:check

      - name: Playwright Compile Check
        run: bunx playwright test --list
        # This validates that all test files compile correctly without executing them

      - name: Validate Playwright Config
        run: |
          echo "Validating Playwright configuration..."
          bunx playwright test --config=playwright.config.ts --list > /dev/null 2>&1 && echo "Configuration valid" || echo "Configuration warning detected"

      - name: Install Playwright (API context)
        run: bun run pw:install
